<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites Menu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 16px;
            color: #2c3e50;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 5px;
            margin-top: 20px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }
        .item-name {
            font-weight: 500;
        }
        .item-price {
            color: #e67e22;
            font-weight: bold;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h1>QuickBites</h1>
    <div class="subtitle">Fresh & Fast Food Menu</div>

    <h2>Starters</h2>
    <div class="item">
        <span class="item-name">French Fries</span>
        <span class="item-price">₹120</span>
    </div>
    <div class="item">
        <span class="item-name">Garlic Bread</span>
        <span class="item-price">₹150</span>
    </div>

    <h2>Main Course</h2>
    <div class="item">
        <span class="item-name">Cheese Burger</span>
        <span class="item-price">₹220</span>
    </div>
    <div class="item">
        <span class="item-name">Margherita Pizza</span>
        <span class="item-price">₹350</span>
    </div>

    <h2>Drinks</h2>
    <div class="item">
        <span class="item-name">Cold Coffee</span>
        <span class="item-price">₹140</span>
    </div>
    <div class="item">
        <span class="item-name">Lemonade</span>
        <span class="item-price">₹90</span>
    </div>

    <footer>Call 98765-43210 to Order</footer>
</div>

</body>
</html>
